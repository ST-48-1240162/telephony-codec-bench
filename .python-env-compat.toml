[meta]
project = "telephony-codec-bench"

[runtime]
requires_cuda = true
min_torch = "2.11.0"

[packages.datasets]
max_major = 3
specifier = ">=2.20,<4.0"

[packages.transformers]
max_major = 4
specifier = ">=4.40.0,<5.0.0"

[packages.fsspec]
exact = "2025.3.0"

[packages.huggingface-hub]
max_major = 0
specifier = ">=0.24.0,<1.0.0"

[packages.librosa]
specifier = ">=0.10.1,<0.12.0"

[packages.noisekit]
specifier = ">=0.1.5,<0.2.0"

[torch]
vision_pairing = "minor_plus_15"
audio_pairing = "match_torch"

[imports]
required = [
  "snac",
  "encodec",
  "noisekit",
  "librosa",
  "soundfile",
  "pystoi",
  "pesq",
]

[[imports.symbols]]
module = "transformers"
names = ["EncodecModel", "AutoProcessor"]
